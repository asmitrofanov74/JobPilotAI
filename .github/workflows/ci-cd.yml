name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobpilot_test
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://jobpilot:jobpilot_secret@localhost:5432/jobpilot_test

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Unit Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://jobpilot:jobpilot_secret@localhost:5432/jobpilot_test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobpilot_test
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./apps/web
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        working-directory: ./apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://jobpilot:jobpilot_secret@localhost:5432/jobpilot_test

      - name: Apply Migrations
        working-directory: ./apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://jobpilot:jobpilot_secret@localhost:5432/jobpilot_test

      - name: Seed Database
        working-directory: ./apps/api
        run: npm run prisma:seed
        env:
          DATABASE_URL: postgresql://jobpilot:jobpilot_secret@localhost:5432/jobpilot_test

      - name: Build Web
        working-directory: ./apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/graphql

      - name: Start API & Web and Wait
        env:
          DATABASE_URL: postgresql://jobpilot:jobpilot_secret@localhost:5432/jobpilot_test
          PORT: '4000'
          CORS_ORIGIN: http://localhost:3001
          JWT_SECRET: dev_jwt_secret
          JWT_REFRESH_SECRET: dev_refresh_secret
          AI_PROVIDER: openrouter
          NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
        run: |
          cd apps/api
          npx nest start > api.log 2>&1 &
          cd ../../apps/web
          npx next start -p 3001 > web.log 2>&1 &
          cd ../../
          for i in $(seq 1 90); do
            if curl -sf -X POST http://localhost:4000/graphql \
                -H 'Content-Type: application/json' \
                -d '{"query":"{ __typename }"}' > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/login > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Services failed to start" >&2
          tail -n 50 apps/api/api.log 2>/dev/null || true
          tail -n 50 apps/web/web.log 2>/dev/null || true
          exit 1

      - name: Run E2E Tests
        working-directory: ./apps/web
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/graphql

      - name: Upload E2E Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            apps/api/api.log
            apps/web/web.log
          if-no-files-found: ignore

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ca-central-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: production
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/jobpilot-api:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/jobpilot-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          target: production
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/jobpilot-web:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/jobpilot-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ca-central-1' }}

      - name: Deploy API
        run: |
          aws ecs update-service \
            --cluster jobpilot-cluster \
            --service api-service \
            --force-new-deployment

      - name: Deploy Web
        run: |
          aws ecs update-service \
            --cluster jobpilot-cluster \
            --service web-service \
            --force-new-deployment

      - name: Health Check
        run: |
          sleep 30
          curl -f https://api.jobpilot.ai/graphql || exit 1
          curl -f https://jobpilot.ai || exit 1
